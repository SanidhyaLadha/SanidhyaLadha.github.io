<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sanidhya Ladha | Front-end developer</title>
<meta name="description" content="Portfolio of Sanidhya Ladha, a founder and front-end developer in Jaipur building clean, fast, mobile-first websites with React and Next.js.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#111827; --muted:#5B6473; --line:#DDE2EA;
  --accent:#0F766E; --accent-ink:#FFFFFF; --peach:#FFD9C4; --peach-ink:#4A2410; --focus:#0F766E;
  --display:'Familjen Grotesk','Segoe UI',system-ui,-apple-system,sans-serif;
  --body:'Onest','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1117; --surface:#161B22; --ink:#E8ECF2; --muted:#9AA4B2; --line:#2A313C;
    --accent:#2DD4BF; --accent-ink:#04211E; --peach:#5A2F1B; --peach-ink:#FFE3D3; --focus:#2DD4BF;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1117; --surface:#161B22; --ink:#E8ECF2; --muted:#9AA4B2; --line:#2A313C;
  --accent:#2DD4BF; --accent-ink:#04211E; --peach:#5A2F1B; --peach-ink:#FFE3D3; --focus:#2DD4BF;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.02em;line-height:1.05}
p{margin:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px;border-radius:4px}
.wrap{width:min(1120px,100% - 2.5rem);margin-inline:auto}
.skip{position:absolute;left:1rem;top:-4rem;background:var(--accent);color:var(--accent-ink);padding:.6rem 1rem;border-radius:.5rem;font-weight:600;z-index:100}
.skip:focus{top:1rem}
mark.ph{background:var(--peach);color:var(--peach-ink);border-radius:.3rem;padding:0 .3em}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;padding:.8rem 1.4rem;border-radius:999px;font:600 1rem var(--body);text-decoration:none;border:2px solid transparent;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn-solid{background:var(--accent);color:var(--accent-ink)}
.btn-solid:hover{filter:brightness(1.08)}
.btn-line{border-color:var(--ink);color:var(--ink)}
.btn-line:hover{background:var(--surface)}
.btn-sm{padding:.5rem 1.05rem;font-size:.95rem}

/* header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;min-height:4rem;gap:1rem}
.brand{font:700 1.25rem var(--display);color:var(--ink);text-decoration:none;letter-spacing:-.02em}
.bar nav{display:flex;align-items:center;gap:1.5rem}
.bar nav a.nl{color:var(--ink);text-decoration:none;font-weight:500}
.bar nav a.nl:hover{text-decoration:underline;text-underline-offset:.3em}

/* get in touch popover */
.touch{position:relative}
.touch-panel{position:absolute;right:0;top:calc(100% + .75rem);width:min(24rem,calc(100vw - 2.5rem));background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:1rem;display:grid;gap:.7rem;box-shadow:0 24px 50px -24px rgba(17,24,39,.55);z-index:30}
.touch-panel[hidden]{display:none}
.touch-title{font:700 1.15rem var(--display);letter-spacing:-.01em}
.touch-row{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.7rem .85rem;border:1px solid var(--line);border-radius:.8rem;background:var(--bg)}
.touch-row .lab{display:block;font-size:.8rem;color:var(--muted)}
.touch-row div{min-width:0}
.touch-row a{color:var(--ink);font-weight:600;font-size:.95rem;text-decoration:none;overflow-wrap:anywhere}
.touch-row a:hover{text-decoration:underline;text-underline-offset:.25em}
.copy{font:600 .88rem var(--body);padding:.35rem .8rem;border-radius:999px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;flex:none}
.copy:hover{border-color:var(--accent)}

/* hero */
.hero{padding-block:clamp(3.5rem,9vw,7.5rem) clamp(2.5rem,6vw,4.5rem)}
.hero h1{font-size:clamp(2.8rem,8.4vw,6.4rem);font-weight:700;letter-spacing:-.04em;line-height:.96;max-width:15ch}
.hero .sub{margin-top:1.75rem;font-size:1.25rem;color:var(--muted);max-width:40rem}
.hero .actions{margin-top:2rem;display:flex;gap:.8rem;flex-wrap:wrap}
.hero h1 .ln{display:block;overflow:hidden;padding-bottom:.08em;margin-bottom:-.08em}
.hero h1 .ln>span{display:block;animation:rise .85s cubic-bezier(.2,.8,.2,1) both}
.hero h1 .ln:nth-child(2)>span{animation-delay:.09s}
.hero h1 .ln:nth-child(3)>span{animation-delay:.18s}
@keyframes rise{from{transform:translateY(105%)}to{transform:none}}

section{padding-block:clamp(3rem,7vw,5.5rem)}
h2{font-size:clamp(1.9rem,4.2vw,2.9rem);font-weight:700}
.lede{color:var(--muted);margin-top:.9rem;max-width:56ch}

/* projects */
.project,#projects{scroll-margin-top:5rem}
.projects{margin-top:3rem;display:grid;gap:clamp(3rem,7vw,5.5rem)}
.project{display:grid;grid-template-columns:1.15fr 1fr;gap:clamp(1.5rem,4vw,3.5rem);align-items:center}
.project.rev .frame{order:2}
.frame{display:block;background:var(--surface);border:1px solid var(--line);border-radius:1rem;overflow:hidden;box-shadow:0 30px 50px -35px rgba(17,24,39,.5);text-decoration:none}
.frame .chrome{display:flex;gap:.4rem;padding:.7rem .9rem;border-bottom:1px solid var(--line);background:var(--bg)}
.frame .chrome i{width:.65rem;height:.65rem;border-radius:50%;background:var(--line)}
.frame .screen{aspect-ratio:16/10;background:var(--bg);position:relative}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.skeleton{position:absolute;inset:0;padding:1.2rem;display:grid;grid-template-rows:auto 1fr auto;gap:.9rem}
.skeleton b{display:block;background:var(--line);border-radius:.5rem}
.skeleton .h{height:1.2rem;width:40%}
.skeleton .m{display:grid;grid-template-columns:1.3fr 1fr;gap:.9rem}
.skeleton .m b:first-child{background:var(--accent);opacity:.25}
.skeleton .f{height:2.2rem}
.project h3{font-size:clamp(1.7rem,3.4vw,2.4rem);font-weight:700}
.meta{margin-top:.6rem;color:var(--muted);font-size:.95rem}
.project .summary{margin-top:1rem}
.project ul.points{margin:1rem 0 0;padding-left:1.2rem;color:var(--muted)}
.project ul.points li{margin-top:.35rem}
.result{margin-top:1.1rem;padding:.8rem 1rem;background:var(--surface);border:1px solid var(--line);border-radius:.8rem;font-weight:500}
.tags{margin-top:1.1rem;display:flex;flex-wrap:wrap;gap:.45rem;list-style:none;padding:0}
.tags li{font-size:.88rem;padding:.2rem .65rem;border-radius:.4rem;background:var(--surface);border:1px solid var(--line)}
.links{margin-top:1.3rem;display:flex;gap:.7rem;flex-wrap:wrap}

/* about */
.about{background:var(--surface);border-block:1px solid var(--line)}
.about-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:clamp(2rem,5vw,4rem);align-items:start}
.about p+p{margin-top:1rem}
.skills{display:grid;gap:1.6rem}
.skills h3{font-size:1.05rem;margin-bottom:.6rem}
.skills .tags{margin-top:0}
.exp{margin-top:3rem;border-top:1px solid var(--line)}
.exp div{display:grid;grid-template-columns:11rem 1fr;gap:1rem;padding:1rem 0;border-bottom:1px solid var(--line)}
.exp b{font-family:var(--display);font-size:1.1rem}
.exp span{color:var(--muted)}

/* contact */
.contact h2{font-size:clamp(2.2rem,6vw,4.2rem);font-weight:700;letter-spacing:-.035em;max-width:16ch}
.contact .actions{margin-top:1.75rem;display:flex;gap:.8rem;flex-wrap:wrap}
footer{padding-block:2rem 3rem;color:var(--muted);font-size:.92rem;border-top:1px solid var(--line)}

@media (max-width:860px){
  .project,.about-grid{grid-template-columns:1fr}
  .project.rev .frame{order:0}
  .bar nav a.nl{display:none}
  .exp div{grid-template-columns:1fr;gap:.2rem}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<a class="skip" href="#work">Skip to my work</a>

<header class="top">
  <div class="wrap bar">
    <a class="brand" href="#" id="brand"></a>
    <nav aria-label="Main">
      <a class="nl" href="#work">Work</a>
      <a class="nl" href="#about">About</a>
      <div class="touch">
        <button class="btn btn-solid btn-sm" id="touch-btn" type="button" aria-expanded="false" aria-controls="touch-panel">Get in touch</button>
        <div class="touch-panel" id="touch-panel" role="dialog" aria-label="Contact details" hidden>
          <p class="touch-title">Let's talk</p>
          <div class="touch-row">
            <div><span class="lab">Email</span><a id="touch-email" href="#"></a></div>
            <button type="button" class="copy" data-copy="email">Copy</button>
          </div>
          <div class="touch-row">
            <div><span class="lab">WhatsApp</span><a id="touch-wa" href="#" target="_blank" rel="noopener"></a></div>
            <button type="button" class="copy" data-copy="wa">Copy</button>
          </div>
        </div>
      </div>
    </nav>
  </div>
</header>

<main>
  <div class="wrap hero">
    <h1 id="hero-title"></h1>
    <p class="sub" id="hero-sub"></p>
    <div class="actions">
      <a class="btn btn-solid" id="see-work" href="#work" target="_blank" rel="noopener">See my work</a>
      <a class="btn btn-line" id="resume-link" href="#contact">Get my resume</a>
    </div>
  </div>

  <section id="work" style="padding-top:1rem">
    <div class="wrap">
      <h2>Selected work</h2>
      <p class="lede" id="work-lede"></p>
      <div class="links" id="work-jump"></div>
      <div class="projects" id="projects"></div>
    </div>
  </section>

  <section class="about" id="about">
    <div class="wrap about-grid">
      <div>
        <h2>About me</h2>
        <div class="lede" id="about-text" style="max-width:none"></div>
      </div>
      <div class="skills" id="skills"></div>
    </div>
    <div class="wrap"><div class="exp" id="exp" aria-label="Experience"></div></div>
  </section>

  <section class="contact" id="contact">
    <div class="wrap">
      <h2 id="contact-title"></h2>
      <p class="lede" id="contact-text"></p>
      <div class="actions" id="contact-actions"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap" id="foot"></div>
</footer>

<script>
/* ==========================================================
   EDIT THIS BLOCK ONLY. Anything in [square brackets] shows up
   highlighted on the page so you can spot what is still unfilled.
   ========================================================== */
const ME = {
  name: "Sanidhya Ladha",
  headline: ["I build clean,", "fast websites", "that work on phones."],
  intro: "I'm a founder and front-end developer in Jaipur working with React and Next.js. I have shipped two live projects: the website for my venture Second Serve, and Opportunity Board, a Next.js app with filters, saved items and an API.",
  email: "sladdha@jpischool.com",
  whatsapp: "+919120000225",          // include the country code
  github: "https://github.com/SanidhyaLadha",
  linkedin: "https://www.linkedin.com/in/sanidhya-ladha-190922359",
  resume: "",                         // e.g. "resume.pdf" once you add the file next to this page
  city: "Jaipur, India"
};

const PROJECTS = [
  {
    title: "Second Serve",
    year: "2026",
    role: "Founder",
    summary: "A single-page website for a venture that collects discarded sports gear, like tennis balls, shuttlecocks, yoga mats and foam, and redesigns it into furniture, decor and installations.",
    points: [
      "Structured the page as a scroll-through story: the problem, the solution, materials, sourcing, a campus pilot and three ways to get involved",
      "Built an interactive 3D hero with Three.js, loaded lazily so the rest of the page appears first",
      "Added flip cards that show each material before and after (tennis balls to floor poufs, shuttlecocks to lamp shades) and a layout that fits phones with no sideways scrolling"
    ],
    result: "",
    stack: ["React", "Three.js", "Tailwind CSS", "Vite"],
    live: "https://sanidhyaladha.github.io/second-serve-website/",
    repo: "https://github.com/SanidhyaLadha/second-serve-website",
    image: "second-serve.png"           // screenshot file, placed next to this page
  },
  {
    title: "Opportunity Board",
    year: "2026",
    role: "Personal project",
    summary: "A mobile-first board where students can search and filter competitions, workshops, hackathons, internships and scholarships. Built as a portfolio project with sample data.",
    points: [
      "Built the search, category, mode and cost filters with React state, plus saved items that persist between visits",
      "Made it accessible: keyboard-friendly chips, a live results count, a skip link and visible focus",
      "Added two Next.js API routes, including a reminder signup form validated on both the client and the server"
    ],
    result: "",
    stack: ["Next.js", "React", "Route Handlers", "CSS"],
    live: "https://opportunity-board-ruddy.vercel.app",
    repo: "https://github.com/SanidhyaLadha/opportunity-board",
    image: "opportunity-board.png"
  }
];

const ABOUT = [
  "I'm the founder of Second Serve, and building its website is where I got hands-on with front-end work. I care about clean layouts, fast pages and sites that feel right on a phone, and I like to ship small and improve often.",
  "I want a role where I own a website end to end, ship quickly, and grow into back-end work as the team grows."
];

const SKILLS = [
  { group: "Front end", items: ["HTML", "CSS", "JavaScript", "React", "Next.js", "Tailwind CSS", "Three.js", "Responsive design"] },
  { group: "Tools", items: ["Git and GitHub", "Vercel", "GitHub Pages", "Vite"] },
  { group: "How I work", items: ["Ship small and often", "Mobile first", "Accessible by default"] }
];

const EXPERIENCE = [
  { when: "Current", what: "Founder", where: "Second Serve, Jaipur" }
];
/* ================= end of editable block ================= */


/* ---------- rendering (no need to edit below) ---------- */
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// escapes text, then highlights [placeholders]
const t = (s) => esc(s).replace(/\[[^\]]+\]/g, (m) => '<mark class="ph">' + m + "</mark>");
const isReal = (u) => u && u.indexOf("[") === -1;

$("#brand").innerHTML = t(ME.name);
document.title = ME.name.replace(/\[|\]/g, "") + " | Front-end developer";

$("#hero-title").innerHTML = ME.headline.map((l) => '<span class="ln"><span>' + esc(l) + " </span></span>").join("");
$("#hero-sub").innerHTML = t(ME.intro);
const resume = $("#resume-link");
if (ME.resume) { resume.href = ME.resume; resume.setAttribute("download", ""); resume.textContent = "Download resume"; }
else { resume.style.display = "none"; }

$("#work-lede").innerHTML = "Two projects I have built, what I did on each, and where you can see them live.";
$("#work-jump").innerHTML = PROJECTS.map((p, i) => '<a class="btn btn-line btn-sm" href="#project-' + (i + 1) + '">' + esc(p.title) + "</a>").join("");

$("#projects").innerHTML = PROJECTS.map((p, i) => {
  // The gray skeleton always sits underneath. If the screenshot file is missing, it stays visible instead of a broken image.
  const shot =
    '<div class="skeleton" aria-hidden="true"><b class="h"></b><div class="m"><b></b><b></b></div><b class="f"></b></div>' +
    (p.image
      ? '<img src="' + esc(p.image) + '" alt="Screenshot of ' + esc(p.title.replace(/\[|\]/g, "")) + '" loading="lazy" width="1280" height="800" onerror="this.remove()">'
      : "");
  const frame = '<div class="frame" role="img" aria-label="Preview of ' + esc(p.title.replace(/\[|\]/g, "")) + '"><div class="chrome" aria-hidden="true"><i></i><i></i><i></i></div><div class="screen">' + shot + "</div></div>";
  const links =
    (p.live ? '<a class="btn btn-solid btn-sm" href="' + esc(p.live) + '" target="_blank" rel="noopener">View live site</a>' : "") +
    (p.repo ? '<a class="btn btn-line btn-sm" href="' + esc(p.repo) + '" target="_blank" rel="noopener">View code</a>' : "");
  return (
    '<article class="project' + (i % 2 ? " rev" : "") + '" id="project-' + (i + 1) + '">' +
    frame +
    "<div>" +
    "<h3>" + t(p.title) + "</h3>" +
    '<p class="meta">' + t(p.role) + ", " + t(p.year) + "</p>" +
    '<p class="summary">' + t(p.summary) + "</p>" +
    '<ul class="points">' + p.points.map((x) => "<li>" + t(x) + "</li>").join("") + "</ul>" +
    (p.result ? '<p class="result">' + t(p.result) + "</p>" : "") +
    '<ul class="tags" aria-label="Built with">' + p.stack.map((s) => "<li>" + esc(s) + "</li>").join("") + "</ul>" +
    (links ? '<div class="links">' + links + "</div>" : "") +
    "</div></article>"
  );
}).join("");

$("#about-text").innerHTML = ABOUT.map((a) => "<p>" + t(a) + "</p>").join("");
$("#skills").innerHTML = SKILLS.map((g) =>
  "<div><h3>" + esc(g.group) + '</h3><ul class="tags">' + g.items.map((i) => "<li>" + esc(i) + "</li>").join("") + "</ul></div>"
).join("");
$("#exp").innerHTML = EXPERIENCE.map((e) =>
  "<div><span>" + t(e.when) + "</span><div style='display:block;padding:0;border:0'><b>" + t(e.what) + "</b><br><span>" + t(e.where) + "</span></div></div>"
).join("");

$("#contact-title").textContent = "Let's build something together.";
$("#contact-text").innerHTML = "Based in " + t(ME.city) + ". The best way to reach me is email.";
const cta = [];
cta.push('<a class="btn btn-solid" href="mailto:' + esc(ME.email.replace(/\[|\]/g, "")) + '">' + t(ME.email) + "</a>");
if (isReal(ME.github)) cta.push('<a class="btn btn-line" href="' + esc(ME.github) + '" target="_blank" rel="noopener">GitHub</a>');
else cta.push('<a class="btn btn-line" href="#contact">GitHub <mark class="ph">[add link]</mark></a>');
if (isReal(ME.linkedin)) cta.push('<a class="btn btn-line" href="' + esc(ME.linkedin) + '" target="_blank" rel="noopener">LinkedIn</a>');
else cta.push('<a class="btn btn-line" href="#contact">LinkedIn <mark class="ph">[add link]</mark></a>');
$("#contact-actions").innerHTML = cta.join("");


/* get in touch popover: shows email and WhatsApp */
const waDigits = ME.whatsapp.replace(/\D/g, "");
const waPretty = ME.whatsapp.replace(/^\+91(\d{5})(\d{5})$/, "+91 $1 $2");
const waLink = "https://wa.me/" + waDigits + "?text=" + encodeURIComponent("Hi " + ME.name.split(" ")[0] + ", I saw your portfolio.");
$("#touch-email").textContent = ME.email; $("#touch-email").href = "mailto:" + ME.email;
$("#touch-wa").textContent = waPretty; $("#touch-wa").href = waLink;
$("#contact-actions").insertAdjacentHTML("beforeend", '<a class="btn btn-line" href="' + esc(waLink) + '" target="_blank" rel="noopener">WhatsApp</a>');

const touchBtn = $("#touch-btn"), touchPanel = $("#touch-panel");
function setTouch(open, returnFocus) {
  touchPanel.hidden = !open;
  touchBtn.setAttribute("aria-expanded", String(open));
  if (!open && returnFocus) touchBtn.focus();
}
touchBtn.addEventListener("click", (e) => { e.stopPropagation(); setTouch(touchPanel.hidden); });
document.addEventListener("click", (e) => { if (!touchPanel.hidden && !e.target.closest(".touch")) setTouch(false); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !touchPanel.hidden) setTouch(false, true); });

document.querySelectorAll(".copy").forEach((btn) => {
  btn.addEventListener("click", async () => {
    const text = btn.dataset.copy === "email" ? ME.email : ME.whatsapp;
    try {
      await navigator.clipboard.writeText(text);
    } catch (err) {
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e2) {}
      ta.remove();
    }
    const old = btn.textContent; btn.textContent = "Copied";
    setTimeout(() => { btn.textContent = old; }, 1500);
  });
});

// "See my work" goes to GitHub. If no GitHub link is set, it scrolls to the projects instead.
if (isReal(ME.github)) { $("#see-work").href = ME.github; }
else { $("#see-work").removeAttribute("target"); $("#see-work").href = "#work"; }
$("#foot").innerHTML = "&copy; " + new Date().getFullYear() + " " + t(ME.name);
</script>
</body>
</html>
